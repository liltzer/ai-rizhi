<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 日知 · 独立新闻站</title><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script></head><body><header class="top"><a class="logo" href="./">◈ AI 日知 <small>RIZHI</small></a><span class="tagline">每天一点，看懂 AI。</span><button id="sync" class="button primary">↻ 读取最新内容</button></header><main><section class="hero"><div><div class="eyebrow">YOUR DAILY SIGNAL</div><h1>AI 的新变化，<br><em>在这里看明白。</em></h1><p>新闻、产品更新与通俗解说。保留最近三个月，想看的随时回来找。</p></div><div class="status-card"><span class="live-dot"></span><strong id="status-title">正在读取内容库</strong><p id="status-text">请稍候</p><small id="latest"></small><button class="text-button" id="show-status">查看来源状态 ↗</button></div></section><div id="notice" class="notice" hidden role="status"></div><section class="toolbar"><div class="tabs"><button data-view="all" class="active">最新消息</button><button data-view="archive">往期回看</button><button data-view="saved">我的收藏 <span id="save-count">0</span></button></div><label class="search">⌕ <input id="search" placeholder="搜索消息、产品或公司" aria-label="搜索消息"></label></section><section id="archive" class="archive" hidden><div class="archive-controls"><div><button data-months="1">最近 1 个月</button><button class="active" data-months="3">最近 3 个月</button></div><label>选择新闻日期 <input id="date" type="date"></label><button id="clear-date">全部日期</button></div><div id="calendar"></div><small>按来源发布时间归档；历史补录保留原事件日期。没有记录的日期不会自动凑数。</small></section><div class="categories" id="categories"><button class="active">全部</button><button>模型进展</button><button>创作工具</button><button>编程与 Agent</button><button>产品动态</button><button>行业观察</button></div><div class="list-label"><h2 id="list-title">最新消息</h2><span id="count"></span></div><div id="articles" aria-live="polite"></div><footer><span>AI 日知 · 来源可查，内容可带走。</span><div><button id="export">导出备份</button><label class="file-button">导入本机备份<input type="file" id="import" accept=".json,application/json" hidden></label><button id="health-footer">运行状态</button></div><small>收藏与本机备份保存在当前浏览器；换电脑可导出。后台约每30分钟采集，可能因平台排队延迟。</small></footer></main><dialog id="detail"><div class="dialog-top"><strong>读懂这条消息</strong><button id="close-detail" aria-label="关闭详解">✕</button></div><div id="detail-body"></div></dialog><dialog id="health"><div class="dialog-top"><strong>新闻来源与更新状态</strong><button id="close-health" aria-label="关闭来源状态">✕</button></div><div id="health-body"></div></dialog><div id="toast" role="status" hidden></div></body></html>
